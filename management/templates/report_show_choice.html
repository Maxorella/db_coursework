<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание отчета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            {% if message %}
                <div class="message">
                    <p>{{ message }}</p>
                </div>
            {% endif %}

            <div class="col-md-6">
                <h2 class="text-center mb-4">Просмотр отчета</h2>
                <form method="POST">
    <!-- Выбор вида отчета -->
    <div class="mb-3">
        <label for="reportType" class="form-label">Выберите вид отчета:</label>
        <select class="form-select" id="reportType" name="report_type" required>
            <option value="" disabled selected>Выберите из списка...</option>
            <option value="1">Отчет по превышениям лимитов</option>
        </select>
    </div>

    <!-- Ввод месяца и года -->
    <div class="mb-3">
        <label for="reportMonth" class="form-label">Месяц:</label>
        <select class="form-select" id="reportMonth" name="month" required>
            <option value="" disabled selected>Выберите месяц...</option>
            <option value="1">Январь</option>
            <option value="2">Февраль</option>
            <option value="3">Март</option>
            <option value="4">Апрель</option>
            <option value="5">Май</option>
            <option value="6">Июнь</option>
            <option value="7">Июль</option>
            <option value="8">Август</option>
            <option value="9">Сентябрь</option>
            <option value="10">Октябрь</option>
            <option value="11">Ноябрь</option>
            <option value="12">Декабрь</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="reportYear" class="form-label">Год:</label>
        <input type="number" class="form-control" id="reportYear" name="year" placeholder="Введите год" min="2000" max="2100" required>
    </div>

    <!-- Кнопки -->
    <div class="d-flex justify-content-between">
        <a href="{{ url_for('main_menu_handler') }}" class="btn btn-secondary">Главное меню</a>
        <button type="submit" class="btn btn-primary">Посмотреть отчет</button>
    </div>
</form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
