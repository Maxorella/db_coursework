<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет</title>
    <link href="{{ url_for('static', filename='report_result.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        <h1>Все сотрудники:</h1>
            <table>
                <thead>
                    <tr>
                        {% for schema_elem in schema_list[1:] %}
                        <th>{{schema_elem}}</th>
                        {% endfor %}
                        <th>Редактировать</th>
                    </tr>
                </thead>
                <tbody>
                    {% for staff_list in staff_list_list %}
                        <tr>
                            {% for staff_elem in staff_list[1:] %}
                            <td>{{ staff_elem }}</td>
                            {% endfor %}
                             <td>
                                <a href="{{ url_for('editor_bp.staff_editor_handler', staff_id=staff_list[0]) }}" class="">Редактировать</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        <p><a href="{{ url_for('main_menu_handler') }}" class="button">В главное меню</a></p>
    </div>
</body>
</html>
