<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление данных о разговорах сотрудника</title>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        {% if message %}
            <div class="message">
                <p>{{ message }}</p>
            </div>
        {% endif %}
        <h1>Добавить данные о сумме разговоров сотрудника.</h1>

        <form action="{{ url_for('admin_bp.admin_report_handler') }}" method="POST">
            <label for="report_year">Год:</label>
            <input type="number" id="report_year" name="report_year" required><br><br>

            <label for="report_month">Месяц:</label>
            <input type="number" id="report_month" name="report_month" required min="1" max="12"><br><br>

            <h3>Данные о разговорах:</h3>

            <!-- Ввод данных для одного телефона и суммы -->
            <label for="phone_number">Номер телефона:</label>
            <input type="text" id="phone_number" name="phone_number" placeholder="89051544123" required><br><br>

            <label for="amount">Сумма, на которую наговорил сотрудник:</label>
            <input type="number" id="amount" name="amount" step="0.01" required><br><br>

            <button type="submit">Добавить данные</button><br><br>
        </form>
    </div>
    <p><a href="{{ url_for('main_menu_handler') }}" class="button">В главное меню</a></p>

</body>
</html>
